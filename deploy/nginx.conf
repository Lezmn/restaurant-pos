# Nginx บน VPS: หน้าบ้านของ deploy/docker-compose.yml — certbot เพิ่ม HTTPS (listen 443) + redirect ให้เอง
# ติดตั้ง (แทนโดเมนจริง):
#   sed -e 's/pos\.example\.com/pos.ร้าน.com/g' -e 's/api\.example\.com/api.ร้าน.com/g' nginx.conf > /etc/nginx/sites-available/restaurant
#   certbot --nginx -d pos.ร้าน.com -d api.ร้าน.com --redirect

# socket.io ต้องอัปเกรดเป็น WebSocket — ส่ง Upgrade/Connection ต่อเฉพาะตอนลูกค้าขอ
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# หน้าเว็บ (ไฟล์ static ใน container web)
server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API (REST + socket.io)
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # รูปเมนูถูกย่อที่หน้าเว็บก่อนส่ง (API รับไม่เกิน 2 MB) — เผื่อส่วนหัว multipart นิดหน่อย กันคำขอก้อนโตยิงเข้ามา
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # เขียนทับด้วย IP จริงของผู้เรียก — ไม่ต่อท้ายค่าที่ส่งมา (API ตั้ง TRUST_PROXY ถ้าต่อท้ายจะปลอม IP หลบ rate limit ได้)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # หน้าจอครัว/แคชเชียร์เปิด socket ค้างทั้งวัน
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
