# Seed menu — กดเองครั้งเดียว: ใส่เมนูตั้งต้นร้านอาหารตามสั่ง (backend/prisma/seed-menu.ts) ลง DB บน VPS
#
# รันซ้ำได้ปลอดภัย: เมนูที่มีชื่อเดิมในหมวดเดิมอยู่แล้วจะข้าม ไม่ทับราคา/รูป/สถานะที่ร้านแก้ไปแล้ว
# ใช้ image migrator ของเวอร์ชันที่ deploy อยู่ (IMAGE_TAG ใน ~/app/.env) — ต้อง deploy เวอร์ชันที่มี seed ชุดนี้ก่อน
# ใช้ secrets ชุดเดียวกับ Deploy: VPS_HOST, VPS_USER, VPS_SSH_KEY
name: Seed menu

on:
  workflow_dispatch:

# ใช้คิวเดียวกับ Deploy — ไม่รันพร้อมตอน deploy กำลังเปลี่ยน image
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: ใส่เมนูตั้งต้นบน VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$TARGET" \
            "cd ~/app && echo \"image: \$(cat DEPLOYED_TAG)\" && docker compose run --rm migrate npm run prisma:seed:menu"

      - name: เช็คเมนูบนหน้าลูกค้า
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$API_URL/public/menu" \
            | jq -r '.[] | "\(.name): \(.menuItems | length) เมนู"'
